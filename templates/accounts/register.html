{% extends "dashboard/base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow-sm">
            <div class="card-body">
                <h4 class="mb-3">Create a Citizen Account</h4>
                <div id="register-alert" class="alert d-none"></div>
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" id="reg-username" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" id="reg-email" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" id="reg-password" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" id="reg-password-confirm" class="form-control">
                </div>
                <button id="register-btn" class="btn btn-primary w-100">Register</button>
                <p class="text-center mt-3 mb-0">
                    Already have an account? <a href="{% url 'login-page' %}">Login here</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/accounts/js/auth.js"></script>
{% endblock %}
